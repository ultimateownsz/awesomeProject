{{ define "main" }}
<div class="graph-container">
  <div class="graph-header">
    <h1>{{ .Title }}</h1>
    <div class="graph-description">
      {{ .Content }}
    </div>
  </div>
  
  <div class="graph-controls">
    <button id="reset-zoom" class="control-btn">Reset View</button>
    <button id="toggle-labels" class="control-btn">Toggle Labels</button>
    <select id="layout-select" class="control-select">
      <option value="force">Force Layout</option>
      <option value="hierarchical">Hierarchical</option>
      <option value="circular">Circular</option>
    </select>
    <select id="filter-select" class="control-select">
      <option value="all">All Nodes</option>
      <option value="categories">Categories Only</option>
      <option value="mechanics">Mechanics Only</option>
    </select>
  </div>
  
  <div id="graph-visualization" class="graph-canvas"></div>
  
  <div class="graph-legend">
    <h3>Categories</h3>
    <div class="legend-item">
      <span class="legend-color" style="background: #3498db;"></span>
      <span>Programming Languages</span>
    </div>
    <div class="legend-item">
      <span class="legend-color" style="background: #2ecc71;"></span>
      <span>Tools & Frameworks</span>
    </div>
    <div class="legend-item">
      <span class="legend-color" style="background: #e74c3c;"></span>
      <span>Web Development</span>
    </div>
    <div class="legend-item">
      <span class="legend-color" style="background: #9b59b6;"></span>
      <span>Data Science</span>
    </div>
    <h3 style="margin-top: 15px;">Game Mechanics</h3>
    <div class="legend-item">
      <span class="legend-color" style="background: #e74c3c;"></span>
      <span>Movement - Wall</span>
    </div>
    <div class="legend-item">
      <span class="legend-color" style="background: #3498db;"></span>
      <span>Movement - Air</span>
    </div>
    <div class="legend-item">
      <span class="legend-color" style="background: #9b59b6;"></span>
      <span>Combat</span>
    </div>
    <div class="legend-item">
      <span class="legend-color" style="background: #f39c12;"></span>
      <span>Special</span>
    </div>
  </div>
  
  <!-- Mechanic Detail Panel -->
  <div id="mechanic-detail-panel" class="mechanic-detail-panel hidden">
    <button class="close-panel" onclick="closeMechanicPanel()">&times;</button>
    <div id="mechanic-detail-content"></div>
  </div>
</div>

<!-- Load D3.js from local vendor directory -->
<script src="/js/vendor/d3.min.js"></script>
<link rel="stylesheet" href="/css/mechanics-graph.css">

<!-- Graph Data - Combined Categories and Mechanics using JSONCanvas format -->
<script>
  // Generate graph data from Hugo content (Categories)
  // Combined with JSONCanvas mechanics data for unified visualization
  window.graphData = {
    nodes: [
      // Category nodes from Hugo content
      {{ range where .Site.Pages "Type" "categories" }}
      {{ if ne .File.ContentBaseName "_index" }}
      {
        id: "{{ .File.ContentBaseName }}",
        label: "{{ .Title }}",
        url: "{{ .RelPermalink }}",
        color: "{{ .Params.color | default "#95a5a6" }}",
        description: "{{ .Params.description | default .Summary }}",
        category: "{{ .Params.category | default .Title }}",
        tags: {{ .Params.tags | jsonify }},
        nodeType: "category"
      },
      {{ end }}
      {{ end }}
    ],
    edges: [
      // Category edges from Hugo content
      {{ range where .Site.Pages "Type" "categories" }}
      {{ if ne .File.ContentBaseName "_index" }}
      {{ $source := .File.ContentBaseName }}
      {{ range .Params.links }}
      {
        source: "{{ $source }}",
        target: "{{ path.Base .url }}",
        label: "{{ .name }}"
      },
      {{ end }}
      {{ end }}
      {{ end }}
    ]
  };

  // JSONCanvas Mechanics Data - following the official JSONCanvas specification
  // See: https://github.com/obsidianmd/jsoncanvas
  window.mechanicsCanvasData = {
    nodes: [
      {
        id: "wall_jump",
        type: "text",
        x: 100,
        y: 100,
        width: 300,
        height: 200,
        text: "# Wall Jump\n\n- **Description**: Allows the player to jump off walls.\n- **Use Case**: Platformers, Metroidvanias.\n- **Difficulty**: Medium\n\n## Implementation Notes\n- Detect wall collision\n- Apply horizontal force away from wall\n- Reset jump counter\n\n## References\n- [Celeste Wall Jump Analysis](https://celestegame.com)\n- [Hollow Knight Movement](https://hollowknight.com)",
        color: "#e74c3c",
        image: "https://media.giphy.com/media/l0HlBO7eyXzSZkJri/giphy.gif",
        imageAlt: "Wall jump animation from Celeste"
      },
      {
        id: "double_jump",
        type: "text",
        x: 500,
        y: 100,
        width: 300,
        height: 200,
        text: "# Double Jump\n\n- **Description**: Allows the player to jump again while in mid-air.\n- **Use Case**: Platformers, Action games.\n- **Difficulty**: Easy\n\n## Implementation Notes\n- Track jump count\n- Allow second jump only when airborne\n- Optional: different jump height\n\n## References\n- [Ori Double Jump](https://www.orithegame.com)\n- [Shovel Knight Guide](https://yachtclubgames.com)",
        color: "#3498db",
        image: "https://media.giphy.com/media/xT9IgzoKnwFNmISR8I/giphy.gif",
        imageAlt: "Double jump animation example"
      },
      {
        id: "air_dash",
        type: "text",
        x: 900,
        y: 100,
        width: 300,
        height: 200,
        text: "# Air Dash\n\n- **Description**: Quick horizontal movement while airborne.\n- **Use Case**: Action games, Platformers.\n- **Difficulty**: Medium\n\n## Implementation Notes\n- Disable gravity during dash\n- Apply velocity in input direction\n- Set dash duration timer\n\n## References\n- [Mega Man X Dash Analysis](https://megaman.capcom.com)\n- [Celeste Dash Mechanics](https://celestegame.com)",
        color: "#9b59b6",
        image: "https://media.giphy.com/media/3o7btNa0RUYa5E7iiQ/giphy.gif",
        imageAlt: "Air dash animation from Mega Man X"
      },
      {
        id: "ground_pound",
        type: "text",
        x: 100,
        y: 400,
        width: 300,
        height: 200,
        text: "# Ground Pound\n\n- **Description**: Rapidly descend and impact the ground.\n- **Use Case**: Platformers, Action games.\n- **Difficulty**: Easy\n\n## Implementation Notes\n- Cancel horizontal momentum\n- Apply strong downward force\n- Trigger impact effect on landing\n\n## References\n- [Mario Ground Pound History](https://mario.nintendo.com)\n- [Super Mario Odyssey](https://supermariobrothers.io)",
        color: "#f39c12",
        image: "https://media.giphy.com/media/FWcoE5AkG3BRe/giphy.gif",
        imageAlt: "Mario ground pound animation"
      }
    ],
    edges: [
      {
        id: "edge_wall_to_double",
        fromNode: "wall_jump",
        fromSide: "right",
        toNode: "double_jump",
        toSide: "left",
        label: "combo"
      },
      {
        id: "edge_double_to_dash",
        fromNode: "double_jump",
        fromSide: "right",
        toNode: "air_dash",
        toSide: "left",
        label: "extends"
      },
      {
        id: "edge_pound_to_wall",
        fromNode: "ground_pound",
        fromSide: "top",
        toNode: "wall_jump",
        toSide: "bottom",
        label: "alternative"
      }
    ]
  };
</script>

<!-- Load combined graph visualization script -->
<script src="/js/combined-graph.js"></script>
{{ end }}
