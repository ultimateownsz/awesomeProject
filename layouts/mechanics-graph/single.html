{{ define "main" }}
<div class="graph-container mechanics-graph-container">
  <div class="graph-header">
    <h1>{{ .Title }}</h1>
    <div class="graph-description">
      {{ .Content }}
    </div>
  </div>
  
  <div class="graph-controls">
    <button id="reset-zoom" class="control-btn">Reset View</button>
    <button id="toggle-labels" class="control-btn">Toggle Labels</button>
    <select id="layout-select" class="control-select">
      <option value="force">Force Layout</option>
      <option value="hierarchical">Hierarchical</option>
      <option value="circular">Circular</option>
    </select>
  </div>
  
  <div id="mechanics-graph-visualization" class="graph-canvas"></div>
  
  <div class="graph-legend mechanics-legend">
    <h3>Mechanic Types</h3>
    <div class="legend-item">
      <span class="legend-color" style="background: #e74c3c;"></span>
      <span>Movement - Wall</span>
    </div>
    <div class="legend-item">
      <span class="legend-color" style="background: #3498db;"></span>
      <span>Movement - Air</span>
    </div>
    <div class="legend-item">
      <span class="legend-color" style="background: #9b59b6;"></span>
      <span>Combat</span>
    </div>
    <div class="legend-item">
      <span class="legend-color" style="background: #f39c12;"></span>
      <span>Special</span>
    </div>
  </div>
  
  <!-- Mechanic Detail Panel -->
  <div id="mechanic-detail-panel" class="mechanic-detail-panel hidden">
    <button class="close-panel" onclick="closeMechanicPanel()">&times;</button>
    <div id="mechanic-detail-content"></div>
  </div>
</div>

<!-- Load D3.js from local vendor directory -->
<link rel="stylesheet" href="/css/graph.css">
<link rel="stylesheet" href="/css/mechanics-graph.css">
<script src="/js/vendor/d3.min.js"></script>

<!-- JSONCanvas Data from mechanic files -->
<script>
  // JSONCanvas mechanics data - parsed from .canvas files
  window.mechanicsCanvasData = {
    nodes: [
      {
        id: "wall_jump",
        type: "text",
        x: 100,
        y: 100,
        width: 300,
        height: 200,
        text: "# Wall Jump\n\n- **Description**: Allows the player to jump off walls.\n- **Use Case**: Platformers, Metroidvanias.\n- **Difficulty**: Medium\n\n## Implementation Notes\n- Detect wall collision\n- Apply horizontal force away from wall\n- Reset jump counter\n\n## References\n- [Celeste Wall Jump Analysis](https://example.com)",
        color: "#e74c3c"
      },
      {
        id: "double_jump",
        type: "text",
        x: 500,
        y: 100,
        width: 300,
        height: 200,
        text: "# Double Jump\n\n- **Description**: Allows the player to jump again while in mid-air.\n- **Use Case**: Platformers, Action games.\n- **Difficulty**: Easy\n\n## Implementation Notes\n- Track jump count\n- Allow second jump only when airborne\n- Optional: different jump height\n\n## References\n- [Double Jump Mechanics Guide](https://example.com)",
        color: "#3498db"
      },
      {
        id: "air_dash",
        type: "text",
        x: 900,
        y: 100,
        width: 300,
        height: 200,
        text: "# Air Dash\n\n- **Description**: Quick horizontal movement while airborne.\n- **Use Case**: Action games, Platformers.\n- **Difficulty**: Medium\n\n## Implementation Notes\n- Disable gravity during dash\n- Apply velocity in input direction\n- Set dash duration timer\n\n## References\n- [Mega Man X Dash Analysis](https://example.com)",
        color: "#9b59b6"
      },
      {
        id: "ground_pound",
        type: "text",
        x: 100,
        y: 400,
        width: 300,
        height: 200,
        text: "# Ground Pound\n\n- **Description**: Rapidly descend and impact the ground.\n- **Use Case**: Platformers, Action games.\n- **Difficulty**: Easy\n\n## Implementation Notes\n- Cancel horizontal momentum\n- Apply strong downward force\n- Trigger impact effect on landing\n\n## References\n- [Mario Ground Pound History](https://example.com)",
        color: "#f39c12"
      }
    ],
    edges: [
      {
        id: "edge_wall_to_double",
        fromNode: "wall_jump",
        fromSide: "right",
        toNode: "double_jump",
        toSide: "left",
        label: "combo"
      },
      {
        id: "edge_double_to_dash",
        fromNode: "double_jump",
        fromSide: "right",
        toNode: "air_dash",
        toSide: "left",
        label: "extends"
      },
      {
        id: "edge_pound_to_wall",
        fromNode: "ground_pound",
        fromSide: "top",
        toNode: "wall_jump",
        toSide: "bottom",
        label: "alternative"
      }
    ]
  };
</script>

<!-- Load mechanics graph visualization script -->
<script src="/js/mechanics-graph.js"></script>
{{ end }}
