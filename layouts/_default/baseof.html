<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  {{ if .Description }}
  <meta name="description" content="{{ .Description }}">
  {{ end }}
  
  <!-- Custom CSS for graph page -->
  {{ if eq .Type "graph" }}
  <link rel="stylesheet" href="/css/graph.css">
  {{ end }}
  
  <!-- Sticky navigation styles -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: #333;
    }
    
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    
    nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
    }
    
    nav a {
      text-decoration: none;
      color: #666;
      font-size: 14px;
      font-weight: 500;
      padding: 0.5rem 0;
      transition: color 0.2s ease;
      position: relative;
    }
    
    nav a:hover {
      color: #000;
    }
    
    nav a:first-child {
      font-weight: 600;
      color: #000;
      margin-right: auto;
    }
    
    main {
      min-height: calc(100vh - 120px);
    }
    
    footer {
      background: #f8f9fa;
      padding: 2rem;
      text-align: center;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      margin-top: 4rem;
    }
    
    footer p {
      color: #666;
      font-size: 14px;
    }
    
    @media (max-width: 768px) {
      nav {
        padding: 1rem;
        gap: 1rem;
        flex-wrap: wrap;
      }
      
      nav a {
        font-size: 13px;
      }
    }
    
    @media (prefers-color-scheme: dark) {
      body {
        background: #1a1a1a;
        color: #e0e0e0;
      }
      
      header {
        background: rgba(26, 26, 26, 0.95);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      nav a {
        color: #b0b0b0;
      }
      
      nav a:hover {
        color: #fff;
      }
      
      nav a:first-child {
        color: #fff;
      }
      
      footer {
        background: #2a2a2a;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      footer p {
        color: #b0b0b0;
      }
    }
  </style>
  
  {{ block "head" . }}{{ end }}
</head>
<body>
  <header>
    <nav>
      <a href="/">{{ .Site.Title }}</a>
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </header>
  
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  
  <footer>
    <p>{{ .Site.Params.copyright | default .Site.Title }} &copy; {{ now.Year }}</p>
  </footer>
</body>
</html>
